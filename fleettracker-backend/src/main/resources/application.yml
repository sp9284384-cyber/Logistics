server:
  port: 8080

spring:
  application:
    name: fleet-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fleet_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:fleet}
    password: ${DB_PASSWORD:fleet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
  expiry-ms: ${JWT_EXPIRY_MS:86400000}

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS:}

fleet:
  location:
    retention-days: ${LOCATION_RETENTION_DAYS:7}
  websocket:
    enabled: ${WEBSOCKET_ENABLED:false}
