<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orange rounded square background -->
  <rect width="64" height="64" rx="12" ry="12" fill="#E8771A"/>

  <!-- Truck body -->
  <rect x="6" y="26" width="34" height="20" rx="2" fill="#FFFFFF"/>

  <!-- Truck cab -->
  <path d="M40 32 L40 46 L56 46 L56 36 Q54 28 48 28 L40 28 Z" fill="#FFFFFF"/>

  <!-- Cab window -->
  <path d="M42 30 L42 36 L54 36 L54 34 Q52 29 47 29 Z" fill="#E8771A" opacity="0.5"/>

  <!-- Wheels -->
  <circle cx="16" cy="47" r="5" fill="#1A2340"/>
  <circle cx="16" cy="47" r="2.5" fill="#FFFFFF"/>
  <circle cx="46" cy="47" r="5" fill="#1A2340"/>
  <circle cx="46" cy="47" r="2.5" fill="#FFFFFF"/>

  <!-- Cargo lines on body -->
  <line x1="12" y1="31" x2="12" y2="44" stroke="#E8771A" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="31" x2="20" y2="44" stroke="#E8771A" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="31" x2="28" y2="44" stroke="#E8771A" stroke-width="1.5" opacity="0.4"/>

  <!-- Headlight -->
  <rect x="54" y="38" width="4" height="3" rx="1" fill="#FFD700"/>
</svg>
