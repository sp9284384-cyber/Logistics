name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run build
        working-directory: frontend
        env:
          # Dummy values so Next.js build doesn't fail without a real backend
          NEXT_PUBLIC_API_URL: https://api.placeholder.example.com
          ADMIN_JWT_SECRET: ci-placeholder-secret-not-real
